<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calcul intérêts composés</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
    }

    main {
      width: min(420px, 90%);
      padding: 32px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 1.5rem;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #aaa;
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #111;
      color: #eee;
      font-size: 1rem;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #ffb800;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #ffc933;
    }

    .resultat {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #333;
      line-height: 1.8;
    }

    .valeur {
      color: #ffb800;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>Calcul d’intérêts composés</h1>

    <label for="somme">Montant initial</label>
    <input id="somme" type="number" value="100" step="0.01" />

    <label for="taux">Taux bénéficiaire quotidien (%)</label>
    <input id="taux" type="number" value="1" step="0.01" />

    <label for="jours">Durée en jours</label>
    <input id="jours" type="number" value="365" />

    <button onclick="calculer()">Calculer</button>

    <div class="resultat" id="resultat"></div>
  </main>

  <script>
    function calculer() {
      const somme = parseFloat(document.getElementById("somme").value);
      const taux = parseFloat(document.getElementById("taux").value) / 100;
      const nbA = parseFloat(document.getElementById("jours").value);

      const intComp = Math.round(
        ((somme * Math.pow(1 + taux, nbA)) - somme) * 100
      ) / 100;

      const taxe = intComp * 0.3;
      const capitalAvantTaxe = somme + intComp;
      const beneficeApresTaxe = intComp - taxe;
      const capitalApresTaxe = capitalAvantTaxe - taxe;

      document.getElementById("resultat").innerHTML = `
        <strong>Résultat :</strong><br>
        Intérêts composés : <span class="valeur">${intComp.toFixed(2)} €</span><br>
        Nouveau capital : <span class="valeur">${capitalAvantTaxe.toFixed(2)} €</span><br>
        Bénéfice après taxation : <span class="valeur">${beneficeApresTaxe.toFixed(2)} €</span><br>
        Capital après taxation : <span class="valeur">${capitalApresTaxe.toFixed(2)} €</span>
      `;
    }
  </script>
</body>
</html>
